$('#stepCards').innerHTML=DATA.steps.map(s=>'<button class="step-card" data-step="'+s.id+'" aria-label="查看 '+s.id+' · '+esc(s.title)+'"><span class="step-id">'+s.id+'</span><strong>'+esc(s.title)+'</strong><p>'+esc(s.brief)+'</p><p class="meta">'+labels[s.status]+' · '+esc(s.who)+'</p><span class="edit-hint">查看详情 / 填写修改意见 →</span></button>').join('');
function count(){const n=DATA.steps.filter(s=>notes[s.id]?.trim()).length;$('#draftCount').textContent=n?n+' 个环节有修改意见':'尚无修改意见';}
function view(name){for(const id of ['overview','detail','exportSection'])$('#'+id).hidden=id!==name;$('#showOverview').setAttribute('aria-pressed',String(name==='overview'));for(const b of document.querySelectorAll('#stepNav [data-step]'))b.setAttribute('aria-pressed',String(name==='detail'&&b.dataset.step===active));}
function select(id){const index=DATA.steps.findIndex(s=>s.id===id),s=DATA.steps[index];if(!s)return;active=id;last=id;view('detail');
const next=s.next===undefined?'<p>下一步未标注。</p>':s.next.length?list(s.next.map(n=>n.condition+' → '+n.to+' · '+DATA.steps.find(x=>x.id===n.to).title)):'<p>此环节为流程终点。</p>';
$('#detailBody').innerHTML='<span class="role" data-status="'+s.status+'">'+labels[s.status]+' · '+esc(s.who)+'</span><h2>'+s.id+' · '+esc(s.title)+'</h2><p>'+esc(s.action)+'</p><div class="info-grid"><div><h3>输入</h3><p>'+esc(s.input)+'</p></div><div><h3>输出</h3><p>'+esc(s.output)+'</p></div></div><div class="limit"><h3>具体量级与规则</h3>'+list(s.limits)+'</div><div class="boundary"><h3>能力边界</h3>'+list(s.boundary)+'</div><h3>失败、暂停与回退</h3><p>'+esc(s.failure)+'</p><h3>下一步及条件</h3>'+next+'<details class="sources"><summary>依据与核对说明</summary>'+list(s.source?.length?s.source:['暂无可核验依据，见本环节状态。'])+'</details><div class="pager"><button id="prev" '+(index===0?'disabled':'')+'>← 上一环节</button><button id="next" '+(index===DATA.steps.length-1?'disabled':'')+'>下一环节 →</button></div>';
$('#impact').textContent=s.impact;$('#proposalLabel').textContent=id+' · 修改意见 / 新设计';$('#proposal').value=notes[id]||'';$('#saveStatus').textContent=storageAvailable?'保存在当前浏览器；不会自动同步给助手。':'无法持久保存，请在关闭前复制或下载汇总。';
$('#prev').onclick=()=>select(DATA.steps[index-1].id);$('#next').onclick=()=>select(DATA.steps[index+1].id);window.scrollTo({top:0});}
function overview(){view('overview');window.scrollTo({top:0});}
function showExport(){view('exportSection');const selected=DATA.steps.filter(s=>notes[s.id]?.trim());$('#exportText').value=selected.length?'流程：'+DATA.title+'\n标识与版本：'+DATA.id+' / '+DATA.version+'\n核对或设计日期：'+DATA.date+'\n范围：'+DATA.scope+'\n\n以下是按编号整理的修改意见；请结合我在对话中的要求继续讨论或实施，这些文字不表示已经实施。\n\n'+selected.map(s=>s.id+' · '+s.title+'\n'+labels[s.status]+'：'+s.brief+'\n我的修改意见：'+notes[s.id].trim()).join('\n\n'):'还没有修改意见。请点开环节，填写想改的地方。';$('#copyStatus').textContent='';window.scrollTo({top:0});}
for(const container of ['stepNav','stepCards'])$('#'+container).onclick=e=>{const b=e.target.closest('[data-step]');if(b)select(b.dataset.step);};
$('#showOverview').onclick=overview;$('#showExport').onclick=showExport;$('#showExportSide').onclick=showExport;$('#backFromExport').onclick=()=>last?select(last):overview();
$('#proposal').oninput=()=>{notes[active]=$('#proposal').value;try{localStorage.setItem(key,JSON.stringify(notes));storageAvailable=true;$('#saveStatus').textContent='已保存在当前浏览器；写好后请复制汇总到对话。';}catch{storageAvailable=false;$('#saveStatus').textContent='未能持久保存；请在关闭前复制或下载汇总。';}count();};
$('#copyExport').onclick=async()=>{try{await navigator.clipboard.writeText($('#exportText').value);$('#copyStatus').textContent='已复制，可粘贴到对话中。';}catch{$('#exportText').focus();$('#exportText').select();$('#copyStatus').textContent='自动复制不可用；内容已全选，请按 Ctrl+C（Mac：⌘C）。';}};
$('#downloadExport').onclick=()=>{const url=URL.createObjectURL(new Blob([$('#exportText').value],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=DATA.id+'-'+DATA.version+'-意见.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
count();
</script></body></html>
