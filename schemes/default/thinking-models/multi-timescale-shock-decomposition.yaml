  "biases": ["先分长中短尺度再综合", "事件的即时价格效应不等于长期基线改变", "投资、产能、库存和产量反应具有不同滞后", "共同因子不能抹平对象特性"],
  "stop_conditions": ["各时间尺度及其证据已分开", "冲击是否改变基线已有明确判断", "关键时滞和失效条件已说明"],
