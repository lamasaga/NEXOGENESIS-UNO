    {"role": "检查支持、挑战结果与证据局限", "accepted_capabilities": ["inspect-evidence-set"], "required_evidence_roles": ["support"]},
    {"role": "核验证据锚点", "accepted_capabilities": ["verify-evidence-anchors"]}
